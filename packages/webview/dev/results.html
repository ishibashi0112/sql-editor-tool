<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>SQL の結果（開発用）</title>
    <link rel="stylesheet" href="dist/results.css" />
    <style>
      /* 上がエディタの代わり、下が結果のパネル（VS Code の下のパネルと同じ並び） */
      body { display: flex; flex-direction: column; }
      #editor { flex: none; height: 180px; margin: 0; padding: 8px; border: none;
        border-bottom: 4px solid #d0d7de; font: 13px ui-monospace, monospace; resize: vertical; }
      #root { flex: 1; min-height: 0; height: auto; }
    </style>
  </head>
  <body>
    <textarea id="editor" spellcheck="false" aria-label="SQL（Ctrl+Enter で実行）"></textarea>
    <div id="root"></div>
    <script src="dist/results.js"></script>
  </body>
</html>
